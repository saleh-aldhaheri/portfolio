name: Code Review

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize

  issue_comment:
    types:
      - created

permissions:
  pull-requests: write

jobs:
  setup-deepseek-review:
    name: DeepSeek Code Review
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: DeepSeek Code Review
        uses: hustcer/deepseek-review@v1
        with:
          model: "deepseek-reasoner"
          base-url: "https://api.deepseek.com"
          watch-mention: "@deepseek"
          chat-token: ${{ secrets.DEEPSEEK_TOKEN }}
          allowed-associations: "OWNER,MEMBER,COLLABORATOR"
