server {
    listen 80;
    listen [::]:80;
    server_name ${NGINX_HOST};

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name ${NGINX_HOST};

    ssl_certificate /etc/letsencrypt/live/saleh-ahamed.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/saleh-ahamed.pro/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location /app {
        set $app_upstream app:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 60s;
        proxy_pass http://$app_upstream;
    }

    location / {
        set $app_upstream app:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Accept-Encoding "";
        sub_filter_once off;
        sub_filter "http://saleh-ahamed.pro/" "https://saleh-ahamed.pro/";
        sub_filter "http://admin.saleh-ahamed.pro/" "https://admin.saleh-ahamed.pro/";
        proxy_pass http://$app_upstream;
    }
}